name: Deploy Multi-Brand Video Suite to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite & Build Distributions
        run: |
          node test.js
          node build.js

      - name: Deploy Brand 1 (vidoob.com) to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vidoob
          directory: dist/vidoob
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy Brand 2 (videosdrive.com) to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: videosdrive
          directory: dist/videosdrive
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
